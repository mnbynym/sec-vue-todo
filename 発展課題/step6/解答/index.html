<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue.js TODO 発展 6</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    /* 完了した TODO に適用するスタイル(クラスバインディングで切り替える) */
    .done {
      text-decoration: line-through;
      color: #999;
    }

    /* マウントが終わるまで中身を隠す。Vue はマウント後に v-cloak 属性を取り除くので、
       このスタイルは「Vue が動き出すまでの間」だけ効く */
    [v-cloak] {
      display: none;
    }
  </style>

  <!-- インポートマップ: "vue" という名前で ES モジュールビルドを読み込めるようにする -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>
</head>

<body>

  <!--
    発展 6: 1 行分を TodoItem コンポーネントに切り出す。
  -->
  <div id="app" v-cloak class="container" style="max-width: 600px; margin-top: 30px;">

    <div class="card border-primary">
      <div class="card-header bg-primary text-white">
        <h3 class="card-title h5 mb-0">TODO リスト</h3>
      </div>
      <div class="card-body">

        <!--
          入力フォーム:
            - v-model で入力欄と newTodo を双方向バインディングする
            - <form> + @submit.prevent なので、ボタンのクリックでも Enter でも追加できる
        -->
        <form class="input-group" @submit.prevent="addTodo">
          <input type="text" class="form-control" placeholder="やることを入力してください"
                 v-model="newTodo">
          <button type="submit" class="btn btn-primary">追加</button>
        </form>

        <hr>

        <!--
          絞り込みボタン:
            - 押された種類を filter に入れる
            - class は静的なもの(btn)と動的なもの(:class)が合成される
        -->
        <div class="btn-group btn-group-sm mb-3" role="group" aria-label="絞り込み">
          <button type="button" class="btn" @click="filter = 'all'"
                  :class="filter === 'all' ? 'btn-primary' : 'btn-outline-primary'">
            すべて
          </button>
          <button type="button" class="btn" @click="filter = 'active'"
                  :class="filter === 'active' ? 'btn-primary' : 'btn-outline-primary'">
            未完了
          </button>
          <button type="button" class="btn" @click="filter = 'completed'"
                  :class="filter === 'completed' ? 'btn-primary' : 'btn-outline-primary'">
            完了
          </button>
        </div>

        <!-- リスト表示: v-for で todos を繰り返し描画(:key を忘れずに) -->
        <ul class="list-group mb-3">
          <!--
            1 行分は TodoItem に任せる。
              :todo  … 子に渡す値(props)
              @xxx   … 子から上がってくるイベント。$event には子が渡した値が入る
          -->
          <todo-item v-for="todo in sortedTodos" :key="todo.id"
                     :todo="todo"
                     @toggle="todo.completed = !todo.completed"
                     @edit="todo.text = $event"
                     @remove="removeTodo(todo)"></todo-item>
        </ul>

        <!-- 条件付きレンダリング: TODO が 1 件もないときだけ表示 -->
        <p v-if="todos.length === 0" class="text-body-secondary">
          TODO はまだありません。上のフォームから追加してください。
        </p>

        <!-- 絞り込んだ結果が 0 件のとき(TODO 自体はあるとき) -->
        <p v-else-if="filteredTodos.length === 0" class="text-body-secondary">
          この条件に一致する TODO はありません。
        </p>

        <!-- 算出プロパティで残りの件数を表示 -->
        <p v-else>
          残り <span class="badge text-bg-secondary">{{ remainingCount }}</span> 件 /
          全 <span class="badge text-bg-secondary">{{ todos.length }}</span> 件
        </p>

        <!-- 完了した TODO が 1 件以上あるときだけボタンを出す -->
        <button v-if="completedCount > 0" class="btn btn-outline-secondary btn-sm"
                @click="clearCompleted">
          完了した {{ completedCount }} 件を削除
        </button>

      </div>
    </div>
  </div>

  <script type="module">

    import { createApp, ref, computed, watch, nextTick } from 'vue'

    // localStorage に保存するときのキー
    const STORAGE_KEY = 'vue-todo-app'

    // 保存されている TODO を読み込む(何も無い / 壊れているときは空の配列)
    function loadTodos() {
      try {
        const json = localStorage.getItem(STORAGE_KEY)
        return json ? JSON.parse(json) : []
      } catch (e) {
        console.error('保存された TODO を読み込めませんでした', e)
        return []
      }
    }

    // 1 行分を受け持つコンポーネント
    const TodoItem = {

      // 親から受け取る値
      props: {
        todo: { type: Object, required: true }
      },

      // 親に向けて出すイベント(書いておくと何を出すのか一目で分かる)
      emits: ['toggle', 'edit', 'remove'],

      setup(props, { emit }) {

        // 「編集中かどうか」はこの行だけの事情なので、コンポーネントの中で持つ
        const editing = ref(false)
        const editingText = ref('')

        async function startEdit() {
          editing.value = true
          editingText.value = props.todo.text
          await nextTick()
          document.getElementById('edit-' + props.todo.id)?.focus()
        }

        function commitEdit() {
          if (!editing.value) {
            return
          }
          editing.value = false
          const text = editingText.value.trim()
          if (text !== '') {
            // props は子から書き換えない。「こう変えてほしい」と親に伝える
            emit('edit', text)
          }
        }

        function cancelEdit() {
          editing.value = false
        }

        return { editing, editingText, startEdit, commitEdit, cancelEdit }
      },

      // 1 ファイルで書くときは、テンプレートを文字列で渡す
      template: `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div class="form-check m-0">
            <input class="form-check-input" type="checkbox"
                   :id="'todo-check-' + todo.id"
                   :checked="todo.completed"
                   @change="$emit('toggle')">

            <form v-if="editing" class="d-inline" @submit.prevent="commitEdit">
              <input type="text" class="form-control form-control-sm"
                     :id="'edit-' + todo.id"
                     v-model="editingText"
                     @blur="commitEdit"
                     @keyup.esc="cancelEdit">
            </form>
            <label v-else class="form-check-label" :for="'todo-check-' + todo.id"
                   :class="{ done: todo.completed }"
                   @dblclick="startEdit">
              {{ todo.text }}
            </label>
          </div>
          <button class="btn btn-danger btn-sm" @click="$emit('remove')">削除</button>
        </li>
      `
    }

    createApp({

      // 使うコンポーネントを登録する
      components: { TodoItem },

      setup() {

        // リアクティブ･プロパティ
        const newTodo = ref('')
        const todos = ref(loadTodos())

        // 絞り込みの種類: 'all' / 'active' / 'completed'
        const filter = ref('all')

        // 追加した TODO に一意な id を振るためのカウンター
        // 保存されていた TODO と id がぶつからないよう、最大値の次から始める
        let nextId = todos.value.reduce((max, t) => Math.max(max, t.id), 0) + 1

        // TODO を追加する
        function addTodo() {
          const text = newTodo.value.trim()
          if (text === '') {
            return
          }
          todos.value.push({
            id: nextId++,
            text: text,
            completed: false
          })
          newTodo.value = ''
        }

        // TODO を削除する(渡された todo 以外を集めた新しい配列に差し替える)
        function removeTodo(todo) {
          todos.value = todos.value.filter((t) => t !== todo)
        }

        // 算出プロパティ: 絞り込んだあとの一覧
        const filteredTodos = computed(() => {
          if (filter.value === 'active') {
            return todos.value.filter((t) => !t.completed)
          }
          if (filter.value === 'completed') {
            return todos.value.filter((t) => t.completed)
          }
          return todos.value
        })

        // 算出プロパティ: 表示する順に並べ替えた一覧(未完了が先、完了が後)
        // 算出プロパティは、別の算出プロパティを材料にして組み立てることもできる
        const sortedTodos = computed(() => {
          // sort() は配列そのものを並べ替える。filteredTodos は絞り込みが 'all' のとき
          // todos.value をそのまま返すので、コピーしないと本体の並びを壊してしまう
          return [...filteredTodos.value].sort((a, b) => Number(a.completed) - Number(b.completed))
        })

        // 算出プロパティ: 未完了の TODO の件数
        // todos が変わったときだけ再計算され、結果はキャッシュされる
        const remainingCount = computed(() => {
          return todos.value.filter((t) => !t.completed).length
        })

        // 算出プロパティ: 完了した TODO の件数
        const completedCount = computed(() => {
          return todos.value.filter((t) => t.completed).length
        })

        // 完了した TODO をまとめて削除する
        function clearCompleted() {
          todos.value = todos.value.filter((t) => !t.completed)
        }

        // todos が変わるたびに保存する
        // deep: true が無いと、配列の中の completed が変わったことに気づけない
        watch(todos, (value) => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(value))
        }, { deep: true })

        // return したものがテンプレートから使えるようになる
        return {
          newTodo,
          todos,
          filter,
          filteredTodos,
          sortedTodos,
          addTodo,
          removeTodo,
          remainingCount,
          completedCount,
          clearCompleted
        }
      }
    }).mount('#app')

  </script>

</body>
</html>
