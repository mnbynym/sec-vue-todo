<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue.js TODO step 1</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    /* 完了した TODO に適用するスタイル(クラスバインディングで切り替える) */
    .done {
      text-decoration: line-through;
      color: #999;
    }
  </style>

  <!-- インポートマップ: "vue" という名前で ES モジュールビルドを読み込めるようにする -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>
</head>

<body>

  <div id="app" class="container" style="max-width: 600px; margin-top: 30px;">
    
    <div class="card border-primary">
      <div class="card-header bg-primary text-white">
        <h3 class="card-title h5 mb-0">TODO リスト</h3>
      </div>
      <div class="card-body">

        <!-- 入力フォーム: v-model で newTodo と双方向バインディング -->
        <div class="input-group">
          <input type="text" class="form-control" placeholder="やることを入力してください">
          <button class="btn btn-primary">追加</button>
        </div>

        <hr>

        <!-- リスト表示: v-for で todos を繰り返し描画(:key を忘れずに) -->
        <ul class="list-group mb-3">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div class="form-check m-0">
              <input class="form-check-input" type="checkbox" id="todo-check">
              <label class="form-check-label" for="todo-check">
                <!-- todo の表示 -->
              </label>
            </div>
            <button class="btn btn-danger btn-sm">削除</button>
          </li>
        </ul>

        <!-- 条件付きレンダリング: TODO が 1 件もないときだけ表示 -->
        <p class="text-body-secondary">
          TODO はまだありません。上のフォームから追加してください。
        </p>

        <!-- 算出プロパティで残りの件数を表示 -->
        <p>
          残り <span class="badge text-bg-secondary"></span> 件 /
          全 <span class="badge text-bg-secondary"></span> 件
        </p>

      </div>
    </div>
  </div>

  <script type="module">
    
    import { createApp, ref, computed } from 'vue'

    createApp({
      setup() {
        return {}
      }
    }).mount('#app')

  </script>

</body>
</html>
