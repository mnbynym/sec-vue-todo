<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue.js TODO step 4</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    /* 完了した TODO に適用するスタイル(クラスバインディングで切り替える) */
    .done {
      text-decoration: line-through;
      color: #999;
    }
  </style>

  <!-- インポートマップ: "vue" という名前で ES モジュールビルドを読み込めるようにする -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>
</head>

<body>

  <!--
    step 4: 入力フォームから TODO を追加できるようにする。
            ただし一覧の描画は step 5 で作るので、この段階では
              - 下のサンプルの <li> が 1 行出たまま
              - 「TODO はまだありません」が出たまま
            になる。追加できているかどうかは、開発者ツールのコンソールに出る
            console.log の中身で確認する。
  -->
  <div id="app" class="container" style="max-width: 600px; margin-top: 30px;">

    <div class="card border-primary">
      <div class="card-header bg-primary text-white">
        <h3 class="card-title h5 mb-0">TODO リスト</h3>
      </div>
      <div class="card-body">

        <!-- 入力フォーム: step 4 で <form> に置き換えて、入力と追加処理をつなぐ -->
        <div class="input-group">
          <input type="text" class="form-control" placeholder="やることを入力してください">
          <button class="btn btn-primary">追加</button>
        </div>

        <hr>

        <!-- リスト表示: step 5 で v-for を使い、この <li> を TODO の数だけ繰り返し描画する -->
        <ul class="list-group mb-3">
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div class="form-check m-0">
              <input class="form-check-input" type="checkbox" id="todo-check">
              <label class="form-check-label" for="todo-check">
                サンプルの TODO
              </label>
            </div>
            <button class="btn btn-danger btn-sm">削除</button>
          </li>
        </ul>

        <!-- 空のときのメッセージ: step 5 で v-if を付け、TODO が 1 件もないときだけ表示する -->
        <p class="text-body-secondary">
          TODO はまだありません。上のフォームから追加してください。
        </p>

        <!-- 件数の表示: 最後(完成)で算出プロパティの値を埋め込む -->
        <p>
          残り <span class="badge text-bg-secondary">0</span> 件 /
          全 <span class="badge text-bg-secondary">0</span> 件
        </p>

      </div>
    </div>
  </div>

  <script type="module">

    import { createApp, ref, computed } from 'vue'

    createApp({
      setup() {

        // リアクティブ･プロパティ
        const newTodo = ref('')
        const todos = ref([])

        // 追加した TODO に一意な id を振るためのカウンター
        // (画面に表示しない値なので ref にする必要はない)
        let nextId = 1

        // return したものがテンプレートから使えるようになる
        return {
          newTodo,
          todos
        }
      }
    }).mount('#app')

  </script>

</body>
</html>
