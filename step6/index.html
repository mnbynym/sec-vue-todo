<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue.js TODO step 6</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    /* 完了した TODO に適用するスタイル(クラスバインディングで切り替える) */
    .done {
      text-decoration: line-through;
      color: #999;
    }
  </style>

  <!-- インポートマップ: "vue" という名前で ES モジュールビルドを読み込めるようにする -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>
</head>

<body>

  <div id="app" class="container" style="max-width: 600px; margin-top: 30px;">
    
    <div class="card border-primary">
      <div class="card-header bg-primary text-white">
        <h3 class="card-title h5 mb-0">TODO リスト</h3>
      </div>
      <div class="card-body">

        <!-- 入力フォーム: v-model で newTodo と双方向バインディング -->
        <div class="input-group">
          <input type="text" class="form-control" placeholder="やることを入力してください"
                  v-model="newTodo" @keyup.enter="addTodo">
          <button class="btn btn-primary" @click="addTodo">追加</button>
        </div>

        <hr>

        <!-- リスト表示: v-for で todos を繰り返し描画(:key を忘れずに) -->
        <ul class="list-group mb-3">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              v-for="todo in todos" :key="todo.id">
            <div class="form-check m-0">
              <input class="form-check-input" type="checkbox" id="todo-check"
                     v-model="todo.completed">
              <label class="form-check-label" for="todo-check"
                    :class="{ done: todo.completed }">
                <!-- todo の表示 -->
                {{ todo.text }}
              </label>
            </div>
            <button class="btn btn-danger btn-sm" @click="removeTodo(todo)">削除</button>
          </li>
        </ul>

        <!-- 条件付きレンダリング: TODO が 1 件もないときだけ表示 -->
        <p v-if="todos.length === 0" class="text-body-secondary">
          TODO はまだありません。上のフォームから追加してください。
        </p>

        <!-- 算出プロパティで残りの件数を表示 -->
        <p>
          残り <span class="badge text-bg-secondary"></span> 件 /
          全 <span class="badge text-bg-secondary"></span> 件
        </p>

      </div>
    </div>
  </div>

  <script type="module">
    
    import { createApp, ref, computed } from 'vue'

    const app = createApp({
      setup() {

        // リアクティブ･プロパティ
        const newTodo = ref('')
        const todos = ref([])

        // 追加した TODO に一意な id を振るためのカウンター
        let nextId = 1

        // TODO を追加する
        function addTodo() {
          const text = newTodo.value.trim()
          if (text === '') {
            return
          }
          todos.value.push({
            id: nextId++,
            text: text,
            completed: false
          })
          newTodo.value = ''
          console.log('現在のTODOリスト:', todos.value)
        }

        // TODO を削除する
        function removeTodo(todo) {
          todos.value = todos.value.filter((t) => t !== todo)
        }

        return {
          newTodo,
          todos,
          addTodo,
          removeTodo
        }
      }
    }).mount('#app')

  </script>

</body>
</html>
