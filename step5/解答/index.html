<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue.js TODO step 5</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    /* 完了した TODO に適用するスタイル(クラスバインディングで切り替える) */
    .done {
      text-decoration: line-through;
      color: #999;
    }
  </style>

  <!-- インポートマップ: "vue" という名前で ES モジュールビルドを読み込めるようにする -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>
</head>

<body>

  <!--
    step 5: 追加した TODO を一覧に表示する。
            チェックボックスで完了/未完了を切り替えられるようにし、
            1 件もないときだけメッセージを出す。
  -->
  <div id="app" class="container" style="max-width: 600px; margin-top: 30px;">

    <div class="card border-primary">
      <div class="card-header bg-primary text-white">
        <h3 class="card-title h5 mb-0">TODO リスト</h3>
      </div>
      <div class="card-body">

        <!--
          入力フォーム:
            - v-model で入力欄と newTodo を双方向バインディングする
            - <form> + @submit.prevent なので、ボタンのクリックでも Enter でも追加できる
        -->
        <form class="input-group" @submit.prevent="addTodo">
          <input type="text" class="form-control" placeholder="やることを入力してください"
                 v-model="newTodo">
          <button type="submit" class="btn btn-primary">追加</button>
        </form>

        <hr>

        <!-- リスト表示: v-for で todos を繰り返し描画(:key を忘れずに) -->
        <ul class="list-group mb-3">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              v-for="todo in todos" :key="todo.id">
            <div class="form-check m-0">
              <!--
                id は文書内で重複してはいけないので、繰り返す要素では
                :id / :for に todo.id を混ぜて 1 件ごとに違う値にする。
                固定の id のままだと、2 件目以降のラベルを押したときに
                1 件目のチェックボックスが反応してしまう。
              -->
              <input class="form-check-input" type="checkbox"
                     :id="'todo-check-' + todo.id"
                     v-model="todo.completed">
              <label class="form-check-label" :for="'todo-check-' + todo.id"
                     :class="{ done: todo.completed }">
                <!-- todo の表示({{ }} は自動でエスケープされるので HTML は埋め込まれない) -->
                {{ todo.text }}
              </label>
            </div>
            <button class="btn btn-danger btn-sm">削除</button>
          </li>
        </ul>

        <!-- 条件付きレンダリング: TODO が 1 件もないときだけ表示 -->
        <p v-if="todos.length === 0" class="text-body-secondary">
          TODO はまだありません。上のフォームから追加してください。
        </p>

        <!-- 件数の表示: 最後(完成)で算出プロパティの値を埋め込む -->
        <p>
          残り <span class="badge text-bg-secondary">0</span> 件 /
          全 <span class="badge text-bg-secondary">0</span> 件
        </p>

      </div>
    </div>
  </div>

  <script type="module">

    import { createApp, ref, computed } from 'vue'

    createApp({
      setup() {

        // リアクティブ･プロパティ
        const newTodo = ref('')
        const todos = ref([])

        // 追加した TODO に一意な id を振るためのカウンター
        // (画面に表示しない値なので ref にする必要はない)
        let nextId = 1

        // TODO を追加する
        function addTodo() {
          const text = newTodo.value.trim()
          if (text === '') {
            return
          }
          todos.value.push({
            id: nextId++,
            text: text,
            completed: false
          })
          newTodo.value = ''
        }

        // return したものがテンプレートから使えるようになる
        return {
          newTodo,
          todos,
          addTodo
        }
      }
    }).mount('#app')

  </script>

</body>
</html>
